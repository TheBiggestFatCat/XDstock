name: 打包安卓 APK

# 触发方式：
#   1. 在仓库 Actions 页面点「Run workflow」手动跑（推荐）
#   2. 推送到 master/main 且改动了 android 目录
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        shell: bash
        run: |
          # 兼容两种仓库结构：整个项目 / 只有 android 目录
          if [ -d android ]; then cd android; fi
          echo "当前目录: $(pwd)"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xdstock-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
